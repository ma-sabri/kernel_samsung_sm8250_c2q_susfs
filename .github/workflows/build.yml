name: Compile Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.0
        with:
          submodules: false

      - name: Install Android Kernel Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev clang lld llvm ccache structural-build-essential

      - name: Execute Shell Build Pipeline
        run: bash build_kernel.sh
