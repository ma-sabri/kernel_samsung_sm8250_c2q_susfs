name: Production Build SM8250 KernelSU-Next SuSFS
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Maximize Runner Performance & Install Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev lld llvm ccache build-essential libncurses-dev python3 git rsync liblz4-tool

      - name: Execute Production Build Sequence
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod +x build_kernel.sh
          bash ./build_kernel.sh
