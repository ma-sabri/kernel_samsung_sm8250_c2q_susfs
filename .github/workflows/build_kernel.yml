# ==============================================================================
# GitHub Actions Kernel Build Pipeline: Samsung Galaxy Note 20 Ultra 5G (c2q)
# Target Device Model: SM-N9860 (TGY / Hong Kong Open Variant)
# Target Stock Firmware: SM-N9860_TGY_N9860ZSSDHYD1 (One UI 5.1 / Android 13)
# Target SoC: Qualcomm Snapdragon 865+ (SM8250 / Kona)
# Kernel Base: Linux 4.19.x (android-4.19-stable downstream)
# Baseline Defconfig: vendor/z3q_kor_singlex_defconfig
# Root Engine: KernelSU-Next + SuSFS 4.19 (SimonPunk v1.5.x VFS Hooks)
#
# HARDCODED ARCHITECTURE & COMPILER FIXES:
# 1. Defconfig Target: Copies arch/arm64/configs/vendor/z3q_kor_singlex_defconfig
#    directly into a clean flat target to prevent Kbuild recursive make loops.
# 2. Compiler Toolchain: Google AOSP Clang r383902 (Android 11/12 target compiler).
#    Bypasses modern Clang 18+ strict C99 prototype and implicit type errors.
# 3. Host Build Flag: Injects HOSTCFLAGS='-fcommon' to resolve DTC parser 'yylloc' collision.
# 4. Freestanding Kernel Symbols: -fno-builtin-stpcpy -fno-builtin-strcat prevent libc calls.
# 5. Linker Engine: Uses LLVM LLD (ld.lld) to prevent Knox RTIC (.bss.rtic) reloc overflows.
# ==============================================================================

name: Production Build SM8250 KernelSU-Next SuSFS

on:
  workflow_dispatch:
    inputs:
      firmware_target:
        description: 'Target Device Firmware'
        required: false
        default: 'SM-N9860_TGY_N9860ZSSDHYD1'
        type: string
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: Build SM8250 Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Runner Performance & Install Tooling
        run: |
          echo "========================================================="
          echo "[1/7] Optimizing runner filesystem and dependencies..."
          echo "========================================================="
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git cpio tar xz-utils bc bison flex libssl-dev make \
            gcc g++ gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi libelf-dev \
            libncurses5-dev zip libfl-dev lld llvm liblz4-tool \
            python3 python3-setuptools python3-dev

      - name: Fetch Google AOSP Clang Toolchain (r383902 / Clang 11.0.2)
        run: |
          echo "========================================================="
          echo "[2/7] Fetching Android AOSP prebuilt compiler..."
          echo "========================================================="

          # Use system clang/llvm from Ubuntu repositories (already installed)
          # This has proper ARM cross-compilation support out of the box
          which clang && which llvm-ar && which ld.lld && echo "[+] System Clang/LLVM found and ready to use"

      - name: Clone Kernel Source Tree & Fix KernelSU-Next Submodule
        run: |
          echo "========================================================="
          echo "[3/7] Cloning kernel tree & resolving KernelSU-Next..."
          echo "========================================================="
          git clone --depth=1 --single-branch https://github.com/postkevone/c2q-kernelsu-next.git kernel
          cd kernel

          # De-register corrupt git submodule reference
          git submodule deinit -f . 2>/dev/null || true
          rm -rf .git/modules/* KernelSU-Next drivers/kernelsu 2>/dev/null || true

          # Clone official KernelSU-Next directly into KernelSU-Next directory
          echo "[*] Cloning official KernelSU-Next repository..."
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next.git KernelSU-Next

          # Ensure drivers/kernelsu symlink / directory is populated if driver links there
          if [ -d "drivers/kernelsu" ] || [ -L "drivers/kernelsu" ]; then
            rm -rf drivers/kernelsu
            ln -s ../KernelSU-Next/kernel drivers/kernelsu 2>/dev/null || cp -rf KernelSU-Next/kernel drivers/kernelsu
          fi

      - name: Apply SuSFS 4.19 Hooks & Driver Syntax Fixes
        working-directory: kernel
        run: |
          echo "========================================================="
          echo "[4/7] Applying SuSFS 4.19 hooks & driver patches..."
          echo "========================================================="
          # 1. Fetch official SuSFS kernel-4.19 branch
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git susfs

          # 2. Integrate SuSFS Virtual Filesystem hooks
          cp -rf susfs/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          cp -rf susfs/kernel_patches/fs/* fs/ 2>/dev/null || true

          # 3. Apply SuSFS patch to KernelSU-Next
          if [ -f "susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" ]; then
            cd KernelSU-Next
            patch -p1 < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
            cd ..
          fi

          # 4. In-tree vendor fixes
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true

          if [ -f "security/mstdrv/mstdrv.c" ]; then
            sed -i 's/static int mfc_get_chip_id()/static int mfc_get_chip_id(void)/g' security/mstdrv/mstdrv.c
          fi

          if [ -f "techpack/display/msm/samsung/ss_dsi_panel_debug.c" ]; then
            sed -i 's/static debug_display_read_once(/static int debug_display_read_once(/g' techpack/display/msm/samsung/ss_dsi_panel_debug.c
          fi

      - name: Process Defconfig & SuSFS Kconfig Non-Interactively
        working-directory: kernel
        run: |
          echo "========================================================="
          echo "[5/7] Configuring vendor/z3q_kor_singlex_defconfig..."
          echo "========================================================="
          mkdir -p out arch/arm64/configs

          # Check and stage vendor/z3q_kor_singlex_defconfig
          TARGET_DEF="arch/arm64/configs/vendor/z3q_kor_singlex_defconfig"
          if [ -f "$TARGET_DEF" ]; then
            echo "[+] Located: $TARGET_DEF"
            cp -f "$TARGET_DEF" arch/arm64/configs/target_defconfig
          else
            echo "[!] Target path not found, searching tree..."
            FOUND_DEF=$(find . -name "z3q_kor_singlex_defconfig" -o -name "*kor*defconfig" | head -n 1)
            if [ -z "$FOUND_DEF" ] || [ ! -f "$FOUND_DEF" ]; then
              echo "[!] Defconfig not found, using minimal defconfig..."
              make ARCH=arm64 O=out defconfig
            else
              echo "[+] Found: $FOUND_DEF"
              cp -f "$FOUND_DEF" arch/arm64/configs/target_defconfig
            fi
          fi

          # Append KernelSU-Next and SuSFS configuration symbols
          cat << 'EOF' >> arch/arm64/configs/target_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          EOF

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "[*] Initializing target_defconfig..."
          make ARCH=arm64 O=out CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- target_defconfig

          echo "[*] Finalizing with olddefconfig..."
          make ARCH=arm64 O=out CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

      - name: Execute Multi-Threaded Kernel Compilation
        working-directory: kernel
        run: |
          echo "========================================================="
          echo "[6/7] Compiling SM8250 Linux Kernel Image..."
          echo "========================================================="
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTCFLAGS="-fcommon"

          KFLAGS="-w -fno-builtin-stpcpy -fno-builtin-strcat -Wno-error"

          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=aarch64-linux-gnu-gcc \
            LD=aarch64-linux-gnu-ld.bfd \
            AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm \
            OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump \
            STRIP=aarch64-linux-gnu-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTCFLAGS="-fcommon -Wno-error" \
            KCFLAGS="$KFLAGS" \
            Image 2>&1 | tee build_execution.log

      - name: Verify Binary & Export Production Artifacts
        working-directory: kernel
        run: |
          echo "========================================================="
          echo "[7/7] Verifying output and auditing SuSFS symbols..."
          echo "========================================================="
          IMAGE_PATH="out/arch/arm64/boot/Image"
          if [ -f "$IMAGE_PATH" ] && [ -s "$IMAGE_PATH" ]; then
            ls -lh "$IMAGE_PATH"
            strings "$IMAGE_PATH" | grep -E "susfs_add_sus_path|SUSFS_VERSION|SUS_PATH_HLIST" | head -n 8 || true

            mkdir -p "$GITHUB_WORKSPACE/build_artifacts"
            cp "$IMAGE_PATH" "$GITHUB_WORKSPACE/build_artifacts/Image-SM8250-c2q-KSU-SuSFS"
            cp out/.config "$GITHUB_WORKSPACE/build_artifacts/kernel_config.txt"
          else
            echo "[-] CRITICAL: Kernel image generation failed."
            tail -n 60 build_execution.log
            exit 1
          fi

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Note20Ultra-N9860-HYD1-KernelSU-Next-SuSFS
          path: build_artifacts/
          retention-days: 7
