# Minimal kernel build workflow for arm64 cross-compile
# - Fixes missing `on:` triggers (push, pull_request, workflow_dispatch)
# - Installs packages, creates out/ directories, sets ARCH/CROSS_COMPILE/KBUILD_OUTPUT
# - Builds kernel and uploads build artifacts
on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
  workflow_dispatch:

name: Kernel build (arm64)

jobs:
  build:
    name: Build kernel (arm64)
    runs-on: ubuntu-latest
    env:
      # adjust as needed
      KBUILD_OUTPUT: ${{ github.workspace }}/out
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install packages and toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev ccache rsync \
            libncurses-dev libelf-dev dwarves cpio python3 python3-distutils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          # optionally tune ccache
          ccache --max-size=1G || true

      - name: Create build output directories
        run: |
          mkdir -p "${KBUILD_OUTPUT}"
          mkdir -p "${KBUILD_OUTPUT}/modules"
          mkdir -p "${KBUILD_OUTPUT}/arch/arm64/boot"

      - name: Export env for following steps
        run: |
          echo "ARCH=${ARCH}" >> $GITHUB_ENV
          echo "CROSS_COMPILE=${CROSS_COMPILE}" >> $GITHUB_ENV
          echo "KBUILD_OUTPUT=${KBUILD_OUTPUT}" >> $GITHUB_ENV

      - name: Configure kernel
        # Use your device defconfig if present, otherwise try defconfig
        run: |
          # If there's a defconfig for your device under arch/arm64/configs, specify it here
          # e.g., make O=$KBUILD_OUTPUT vendor_defconfig
          if [ -f "${GITHUB_WORKSPACE}/defconfig" ]; then
            echo "Using repo defconfig file"
            cp defconfig ${KBUILD_OUTPUT}/.config
          elif ls arch/arm64/configs/* 1> /dev/null 2>&1; then
            echo "Using arch/arm64 config (attempting defconfig)"
            make O=${KBUILD_OUTPUT} defconfig
          else
            echo "No defconfig found — you should provide a defconfig or .config in the repo"
            # fallback: try make allyesconfig (will be large)
            make O=${KBUILD_OUTPUT} defconfig || true
          fi

      - name: Build kernel
        run: |
          # Adjust -j if you want to limit parallelism
          make -j$(nproc) O=${KBUILD_OUTPUT} Image dtbs modules || ( echo "Build failed"; exit 1 )

      - name: Install modules into staging dir and package
        run: |
          MOD_STAGING=${KBUILD_OUTPUT}/modules-staging
          mkdir -p ${MOD_STAGING}
          make -j$(nproc) O=${KBUILD_OUTPUT} INSTALL_MOD_PATH=${MOD_STAGING} modules_install
          # Create tarballs for modules and full out dir
          (cd ${KBUILD_OUTPUT} && tar -czf ${GITHUB_WORKSPACE}/kernel-out.tar.gz .)
          (cd ${MOD_STAGING} && tar -czf ${GITHUB_WORKSPACE}/kernel-modules.tar.gz .)

      - name: Collect artifacts
        run: |
          # common kernel outputs; adjust paths if your tree differs
          ls -lah ${KBUILD_OUTPUT} || true
          # try common boot images (Image / Image.gz / Image.gz-dtb / zImage)
          for f in \
            ${KBUILD_OUTPUT}/arch/arm64/boot/Image \
            ${KBUILD_OUTPUT}/arch/arm64/boot/Image.gz \
            ${KBUILD_OUTPUT}/arch/arm64/boot/Image.gz-dtb \
            ${KBUILD_OUTPUT}/arch/arm64/boot/zImage \
            ${KBUILD_OUTPUT}/arch/arm64/boot/dts/*/*.dtb \
            ${GITHUB_WORKSPACE}/kernel-out.tar.gz \
            ${GITHUB_WORKSPACE}/kernel-modules.tar.gz \
          ; do
            if [ -e "$f" ]; then
              echo "Found $f"
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            kernel-out.tar.gz
            kernel-modules.tar.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/zImage
            out/arch/arm64/boot/dts/**/*.dtb
